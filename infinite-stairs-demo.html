<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <title>無限階段 - Infinite Stairs</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Orbitron:wght@300;400;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #16213e 50%, #0f0f23 100%);
            font-family: 'Orbitron', monospace;
            overflow: hidden;
            color: #fff;
            cursor: none;
        }

        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        #title {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: auto;
        }

        #title h1 {
            font-family: 'Cinzel', serif;
            font-size: 3.5rem;
            font-weight: 900;
            background: linear-gradient(45deg, #d4af37, #ffd700, #fff8dc, #f0e68c);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: goldShimmer 4s ease-in-out infinite;
            text-shadow: 0 0 40px rgba(212, 175, 55, 0.5);
            letter-spacing: 3px;
        }

        #title .subtitle {
            font-size: 1.2rem;
            margin-top: 15px;
            color: #c0c0c0;
            letter-spacing: 4px;
            font-weight: 300;
        }

        @keyframes goldShimmer {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        #controls {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 30px;
            pointer-events: auto;
        }

        .control-panel {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-radius: 20px;
            padding: 25px;
            min-width: 220px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .control-panel h3 {
            color: #d4af37;
            margin-bottom: 20px;
            font-size: 1.3rem;
            text-align: center;
            font-family: 'Cinzel', serif;
        }

        .slider-group {
            margin-bottom: 20px;
        }

        .slider-group label {
            display: block;
            font-size: 1rem;
            margin-bottom: 8px;
            color: #e0e0e0;
            font-weight: 300;
        }

        .slider {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: rgba(212, 175, 55, 0.2);
            outline: none;
            -webkit-appearance: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: linear-gradient(45deg, #d4af37, #ffd700);
            cursor: pointer;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.6);
        }

        .info-panel {
            position: absolute;
            top: 50%;
            right: 40px;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(25px);
            border: 2px solid rgba(212, 175, 55, 0.2);
            border-radius: 25px;
            padding: 30px;
            max-width: 350px;
            pointer-events: auto;
        }

        .info-panel h3 {
            color: #d4af37;
            margin-bottom: 20px;
            font-size: 1.4rem;
            font-family: 'Cinzel', serif;
        }

        .info-panel p {
            font-size: 1rem;
            line-height: 1.8;
            color: #ddd;
            margin-bottom: 15px;
            font-weight: 300;
        }

        .mystical-orb {
            position: absolute;
            top: 20%;
            left: 15%;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle at 30% 30%, rgba(212, 175, 55, 0.4) 0%, rgba(255, 215, 0, 0.2) 50%, transparent 70%);
            border-radius: 50%;
            animation: orbFloat 8s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes orbFloat {
            0%, 100% { 
                transform: translate(0, 0) scale(1);
                opacity: 0.4;
            }
            33% { 
                transform: translate(50px, -30px) scale(1.2);
                opacity: 0.6;
            }
            66% { 
                transform: translate(-30px, 40px) scale(0.8);
                opacity: 0.3;
            }
        }

        .geometric-pattern {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(30deg, transparent 40%, rgba(212, 175, 55, 0.03) 50%, transparent 60%),
                linear-gradient(-30deg, transparent 40%, rgba(212, 175, 55, 0.03) 50%, transparent 60%);
            background-size: 100px 100px;
            animation: patternShift 20s linear infinite;
            pointer-events: none;
        }

        @keyframes patternShift {
            0% { background-position: 0 0, 0 0; }
            100% { background-position: 100px 100px, -100px -100px; }
        }

        .custom-cursor {
            position: fixed;
            width: 20px;
            height: 20px;
            background: radial-gradient(circle, #d4af37 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            mix-blend-mode: difference;
            transition: transform 0.1s ease;
        }

        .step-counter {
            position: absolute;
            top: 150px;
            left: 40px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 15px;
            padding: 20px;
            pointer-events: auto;
        }

        .step-counter h4 {
            color: #d4af37;
            margin-bottom: 10px;
            font-family: 'Cinzel', serif;
        }

        .step-counter .count {
            font-size: 2rem;
            color: #fff;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="custom-cursor" id="cursor"></div>
    <div class="geometric-pattern"></div>
    
    <div id="container"></div>
    
    <div id="ui-overlay">
        <div class="mystical-orb"></div>
        
        <div id="title">
            <h1>無限階段</h1>
            <div class="subtitle">INFINITE STAIRS</div>
        </div>

        <div class="step-counter">
            <h4>歩数</h4>
            <div class="count" id="stepCount">0</div>
        </div>

        <div id="controls">
            <div class="control-panel">
                <h3>階段制御</h3>
                <div class="slider-group">
                    <label>階段の高さ</label>
                    <input type="range" class="slider" id="stepHeight" min="0.1" max="1.0" step="0.05" value="0.3">
                </div>
                <div class="slider-group">
                    <label>階段の幅</label>
                    <input type="range" class="slider" id="stepWidth" min="1.0" max="4.0" step="0.1" value="2.0">
                </div>
                <div class="slider-group">
                    <label>回転速度</label>
                    <input type="range" class="slider" id="rotationSpeed" min="0.0" max="0.02" step="0.001" value="0.005">
                </div>
            </div>

            <div class="control-panel">
                <h3>視覚効果</h3>
                <div class="slider-group">
                    <label>霧の濃度</label>
                    <input type="range" class="slider" id="fogDensity" min="0.0" max="0.1" step="0.005" value="0.02">
                </div>
                <div class="slider-group">
                    <label>光の強度</label>
                    <input type="range" class="slider" id="lightIntensity" min="0.1" max="2.0" step="0.1" value="1.0">
                </div>
                <div class="slider-group">
                    <label>階段数</label>
                    <input type="range" class="slider" id="stairCount" min="20" max="100" step="5" value="60">
                </div>
            </div>
        </div>

        <div class="info-panel">
            <h3>ペンローズの階段</h3>
            <p>数学者ロジャー・ペンローズが考案した「不可能図形」の一つ。</p>
            <p>エッシャーの版画「上昇と下降」でも有名な、永遠に続く階段の錯視。</p>
            <p>3D空間では実現不可能だが、視点の操作により錯覚を体験できます。</p>
            <p><strong>操作:</strong> マウスで視点回転、ホイールでズーム</p>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "./build/three.module.js",
            "three/addons/": "./examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // カスタムカーソル
        const cursor = document.getElementById('cursor');
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX - 10 + 'px';
            cursor.style.top = e.clientY - 10 + 'px';
        });

        // Three.js セットアップ
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x0f0f23, 1);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        
        // 霧の追加
        scene.fog = new THREE.FogExp2(0x0f0f23, 0.02);
        
        document.getElementById('container').appendChild(renderer.domElement);

        // オービットコントロール
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.5;
        controls.minDistance = 5;
        controls.maxDistance = 50;

        // ライティング
        const ambientLight = new THREE.AmbientLight(0x404040, 0.4);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xd4af37, 1.0);
        directionalLight.position.set(10, 20, 10);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 4096;
        directionalLight.shadow.mapSize.height = 4096;
        directionalLight.shadow.camera.near = 0.1;
        directionalLight.shadow.camera.far = 100;
        directionalLight.shadow.camera.left = -50;
        directionalLight.shadow.camera.right = 50;
        directionalLight.shadow.camera.top = 50;
        directionalLight.shadow.camera.bottom = -50;
        scene.add(directionalLight);

        // ポイントライト（動的）
        const pointLight = new THREE.PointLight(0xffd700, 0.8, 30);
        pointLight.position.set(0, 10, 0);
        scene.add(pointLight);

        // 階段生成クラス
        class InfiniteStairs {
            constructor() {
                this.group = new THREE.Group();
                this.stairs = [];
                this.stepHeight = 0.3;
                this.stepWidth = 2.0;
                this.stairCount = 60;
                this.currentStep = 0;
                
                this.createStairs();
                scene.add(this.group);
            }

            createStairs() {
                // 既存の階段をクリア
                this.stairs.forEach(stair => {
                    this.group.remove(stair);
                });
                this.stairs = [];

                const stepGeometry = new THREE.BoxGeometry(this.stepWidth, this.stepHeight, this.stepWidth);
                
                // グラデーションマテリアル
                const materials = [];
                for (let i = 0; i < this.stairCount; i++) {
                    const hue = (i / this.stairCount) * 0.1 + 0.1; // 金色系のグラデーション
                    const color = new THREE.Color().setHSL(hue, 0.8, 0.6);
                    const material = new THREE.MeshPhongMaterial({ 
                        color: color,
                        shininess: 100,
                        transparent: true,
                        opacity: 0.9
                    });
                    materials.push(material);
                }

                // 螺旋階段の生成
                const radius = 8;
                for (let i = 0; i < this.stairCount; i++) {
                    const angle = (i / this.stairCount) * Math.PI * 4; // 2回転
                    const x = Math.cos(angle) * radius;
                    const z = Math.sin(angle) * radius;
                    const y = i * this.stepHeight;

                    const step = new THREE.Mesh(stepGeometry, materials[i]);
                    step.position.set(x, y, z);
                    step.rotation.y = angle + Math.PI / 2;
                    step.castShadow = true;
                    step.receiveShadow = true;

                    // ペンローズ効果のための位置調整
                    if (i > this.stairCount * 0.75) {
                        const fadeStart = this.stairCount * 0.75;
                        const fadeProgress = (i - fadeStart) / (this.stairCount - fadeStart);
                        step.material.opacity = 0.9 * (1 - fadeProgress);
                        
                        // 上部の階段を下部に接続する錯視効果
                        const connectionY = (i - this.stairCount) * this.stepHeight;
                        step.position.y = y + connectionY * fadeProgress;
                    }

                    this.stairs.push(step);
                    this.group.add(step);
                }

                // 中央の柱
                const pillarGeometry = new THREE.CylinderGeometry(0.5, 0.5, this.stairCount * this.stepHeight);
                const pillarMaterial = new THREE.MeshPhongMaterial({ 
                    color: 0x8b7355,
                    shininess: 50
                });
                const pillar = new THREE.Mesh(pillarGeometry, pillarMaterial);
                pillar.position.y = (this.stairCount * this.stepHeight) / 2;
                pillar.castShadow = true;
                pillar.receiveShadow = true;
                this.group.add(pillar);
            }

            update() {
                // 階段の動的効果
                this.stairs.forEach((stair, index) => {
                    const time = Date.now() * 0.001;
                    const wave = Math.sin(time + index * 0.1) * 0.02;
                    stair.position.y += wave;
                    
                    // 光る効果
                    const glowIntensity = (Math.sin(time * 2 + index * 0.2) + 1) * 0.1;
                    stair.material.emissive.setHSL(0.1, 0.5, glowIntensity);
                });

                // 歩数カウンター更新
                this.currentStep = Math.floor((Date.now() * 0.001) * 2) % this.stairCount;
                document.getElementById('stepCount').textContent = this.currentStep;
            }

            updateParameters(height, width, count) {
                if (this.stepHeight !== height || this.stepWidth !== width || this.stairCount !== count) {
                    this.stepHeight = height;
                    this.stepWidth = width;
                    this.stairCount = count;
                    this.createStairs();
                }
            }
        }

        // 無限階段インスタンス
        const infiniteStairs = new InfiniteStairs();

        // パーティクルシステム
        const particleCount = 200;
        const particles = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const velocities = [];

        for (let i = 0; i < particleCount; i++) {
            positions[i * 3] = (Math.random() - 0.5) * 100;
            positions[i * 3 + 1] = Math.random() * 50;
            positions[i * 3 + 2] = (Math.random() - 0.5) * 100;
            
            velocities.push({
                x: (Math.random() - 0.5) * 0.02,
                y: Math.random() * 0.01,
                z: (Math.random() - 0.5) * 0.02
            });
        }

        particles.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        const particleMaterial = new THREE.PointsMaterial({
            color: 0xd4af37,
            size: 0.1,
            transparent: true,
            opacity: 0.6,
            blending: THREE.AdditiveBlending
        });

        const particleSystem = new THREE.Points(particles, particleMaterial);
        scene.add(particleSystem);

        // UI コントロール
        const stepHeightSlider = document.getElementById('stepHeight');
        const stepWidthSlider = document.getElementById('stepWidth');
        const rotationSpeedSlider = document.getElementById('rotationSpeed');
        const fogDensitySlider = document.getElementById('fogDensity');
        const lightIntensitySlider = document.getElementById('lightIntensity');
        const stairCountSlider = document.getElementById('stairCount');

        stepHeightSlider.addEventListener('input', updateStairs);
        stepWidthSlider.addEventListener('input', updateStairs);
        stairCountSlider.addEventListener('input', updateStairs);

        function updateStairs() {
            infiniteStairs.updateParameters(
                parseFloat(stepHeightSlider.value),
                parseFloat(stepWidthSlider.value),
                parseInt(stairCountSlider.value)
            );
        }

        rotationSpeedSlider.addEventListener('input', (e) => {
            controls.autoRotateSpeed = parseFloat(e.target.value) * 100;
        });

        fogDensitySlider.addEventListener('input', (e) => {
            scene.fog.density = parseFloat(e.target.value);
        });

        lightIntensitySlider.addEventListener('input', (e) => {
            directionalLight.intensity = parseFloat(e.target.value);
        });

        // カメラ位置
        camera.position.set(15, 10, 15);
        camera.lookAt(0, 5, 0);

        // アニメーションループ
        function animate() {
            requestAnimationFrame(animate);

            const time = Date.now() * 0.001;

            // 無限階段の更新
            infiniteStairs.update();

            // パーティクルアニメーション
            const positions = particleSystem.geometry.attributes.position.array;
            for (let i = 0; i < particleCount; i++) {
                positions[i * 3] += velocities[i].x;
                positions[i * 3 + 1] += velocities[i].y;
                positions[i * 3 + 2] += velocities[i].z;

                // 境界チェック
                if (positions[i * 3 + 1] > 50) {
                    positions[i * 3 + 1] = 0;
                }
            }
            particleSystem.geometry.attributes.position.needsUpdate = true;

            // ポイントライトの動き
            pointLight.position.x = Math.sin(time * 0.5) * 10;
            pointLight.position.z = Math.cos(time * 0.5) * 10;

            // 階段グループの微細な回転
            infiniteStairs.group.rotation.y += parseFloat(rotationSpeedSlider.value);

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // リサイズ対応
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
